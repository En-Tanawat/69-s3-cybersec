services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - "54326:5432"
    environment:
      - POSTGRES_USER=tanawat
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=tanawat
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: 69-s3-admin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: tanawat-chi@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: 1234
    depends_on:
      - db

volumes:
  postgres_data:
